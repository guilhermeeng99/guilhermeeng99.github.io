<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Guilherme Passos - Flutter Engineer & Mobile Entrepreneur with 7+ years crafting high-performance apps and games reaching 12M+ downloads worldwide.">
  <meta name="keywords" content="Flutter Engineer, Mobile Engineer, Guilherme Passos, Portfolio, Mobile Apps, Flutter, Games, Android, iOS">
  <meta name="author" content="Guilherme Passos">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Guilherme Passos">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Guilherme Passos - Flutter Engineer</title>
  <link rel="manifest" href="manifest.json">

  <!-- Instant splash painted by the browser before the Flutter engine boots,
       so the user never sees a blank white frame on a cold load. Shows the GP
       logo (gently breathing) from the very first paint; the in-app
       LoadingPage continues with the same logo, so the brand mark is
       continuous with no second "logo appears" moment. Fades out on the
       engine's `flutter-first-frame` event. -->
  <style>
    #splash {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0A1628;
      z-index: 9999;
      opacity: 1;
      transition: opacity 0.4s ease-out;
    }
    #splash.splash--hidden {
      opacity: 0;
      pointer-events: none;
    }
    #splash .logo {
      width: 88px;
      height: auto;
      animation: splash-breathe 1.8s ease-in-out infinite;
      filter: drop-shadow(0 0 18px rgba(108, 99, 255, 0.35));
    }
    @keyframes splash-breathe {
      0%, 100% { transform: scale(0.94); opacity: 0.85; }
      50%      { transform: scale(1.04); opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      #splash .logo { animation: none; }
    }
  </style>
</head>
<body>
  <div id="splash"><img class="logo" src="logo.webp" alt="GP" /></div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var splash = document.getElementById('splash');
      if (!splash) return;
      splash.classList.add('splash--hidden');
      splash.addEventListener('transitionend', function () {
        splash.remove();
      });
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
