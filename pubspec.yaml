name: my_portfolio
description: "My engineer portfolio app built with Flutter. Showcasing my projects, skills, and contact information in a sleek and responsive design."

publish_to: 'none'

version: 1.3.0+12

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_svg: ^2.0.17
  go_router: ^17.2.3
  logger: ^2.7.0
  slang: ^4.14.0
  slang_flutter: ^4.14.0
  url_launcher: ^6.3.2

dev_dependencies:
  bloc_test: ^10.0.0
  flutter_test:
    sdk: flutter
  melos: ^7.7.0
  mocktail: ^1.0.4
  very_good_analysis: ^10.2.0

melos:
  scripts:
    slang:
      run: dart run slang

    build:web:
      description: Build Flutter web (main app) for production.
      run: flutter build web --release

flutter:

  assets:
    - lib/app/assets/i18n/
    - lib/app/assets/images/
    - lib/app/assets/images/projects/
    - lib/app/assets/icons/
  uses-material-design: true

  # Self-hosted to avoid the runtime network fetch (and font-swap flash) that
  # google_fonts incurred. Inter + Space Grotesk are variable fonts (one file
  # spans all weights; Flutter maps fontWeight to the wght axis). JetBrains
  # Mono is only used at w400, so the static Regular is enough.
  fonts:
    - family: Inter
      fonts:
        - asset: lib/app/assets/fonts/Inter-Variable.ttf
    - family: SpaceGrotesk
      fonts:
        - asset: lib/app/assets/fonts/SpaceGrotesk-Variable.ttf
    - family: JetBrainsMono
      fonts:
        - asset: lib/app/assets/fonts/JetBrainsMono-Regular.ttf
